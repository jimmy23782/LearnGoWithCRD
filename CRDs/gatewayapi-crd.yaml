apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gatewayapis.platform.mac.com
spec:
  group: platform.mac.com
  scope: Namespaced
  names:
    plural: gatewayapis
    singular: gatewayapi
    kind: GatewayAPI
    shortNames:
      - gapi
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - teamName
                - apiName
                - backend
                - authentication
                - environment
              properties:
                teamName:
                  type: string
                apiName:
                  type: string
                backend:
                  type: object
                  required:
                    - url
                    - healthCheck
                  properties:
                    url:
                      type: string
                    healthCheck:
                      type: object
                      required:
                        - path
                        - interval
                      properties:
                        path:
                          type: string
                        interval:
                          type: string
                          pattern: '^\\d+(ms|s|m|h)$'
                authentication:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      enum:
                        - oidc
                        - jwt
                        - basic
                        - none
                environment:
                  type: string
                  enum:
                    - dev
                    - staging
                    - prod
                routes:
                  type: array
                  items:
                    type: object
                    required:
                      - path
                      - methods
                    properties:
                      path:
                        type: string
                      methods:
                        type: array
                        items:
                          type: string
                          enum:
                            - GET
                            - POST
                            - PUT
                            - DELETE